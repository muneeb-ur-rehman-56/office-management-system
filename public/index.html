<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101b35">
  <title>OfficeFlow — Office Management</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/styles.css">
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
<div class="app-shell">
  <aside class="sidebar" id="sidebar">
    <div class="brand"><div class="brand-mark"><i data-lucide="layers"></i></div><div><b>OfficeFlow</b><small>MANAGEMENT SUITE</small></div></div>
    <div class="workspace"><span class="workspace-dot"></span><span>Workspace</span><i data-lucide="chevrons-up-down"></i></div>
    <nav id="navigation">
      <p class="nav-label">WORKSPACE</p>
      <button class="nav-item active" data-page="dashboard"><i data-lucide="layout-dashboard"></i>Dashboard</button>
      <button class="nav-item" data-page="employees"><i data-lucide="users"></i>Employees</button>
      <button class="nav-item" data-page="departments"><i data-lucide="network"></i>Departments</button>
      <button class="nav-item" data-page="attendance"><i data-lucide="calendar-check"></i>Attendance</button>
      <button class="nav-item" data-page="leaves"><i data-lucide="calendar-days"></i>Leave management</button>
      <button class="nav-item" data-page="payroll"><i data-lucide="wallet"></i>Payroll</button>
      <p class="nav-label">OPERATIONS</p>
      <button class="nav-item" data-page="tasks"><i data-lucide="list-checks"></i>Tasks & projects</button>
      <button class="nav-item" data-page="expenses"><i data-lucide="receipt"></i>Expenses</button>
      <button class="nav-item" data-page="income"><i data-lucide="trending-up"></i>Income</button>
      <button class="nav-item" data-page="assets"><i data-lucide="monitor"></i>Assets & inventory</button>
      <button class="nav-item" data-page="documents"><i data-lucide="folder-open"></i>Documents</button>
      <button class="nav-item" data-page="customers"><i data-lucide="contact"></i>Customers</button>
      <button class="nav-item" data-page="visitors"><i data-lucide="id-card"></i>Visitors</button>
      <p class="nav-label">ADMINISTRATION</p>
      <button class="nav-item" data-page="meetings"><i data-lucide="calendar"></i>Meetings & events</button>
      <button class="nav-item" data-page="announcements"><i data-lucide="megaphone"></i>Announcements</button>
      <button class="nav-item" data-page="reports"><i data-lucide="chart-no-axes-combined"></i>Reports</button>
      <button class="nav-item" data-page="activity"><i data-lucide="history"></i>Activity log</button>
      <button class="nav-item" data-page="settings"><i data-lucide="settings"></i>Settings</button>
    </nav>
    <div class="sidebar-bottom"><div class="help-card"><div class="help-icon"><i data-lucide="life-buoy"></i></div><b>Need a hand?</b><span>Read the setup guide to get started.</span><a href="/README.md" target="_blank">View documentation <i data-lucide="arrow-up-right"></i></a></div><div class="user-mini"><div class="avatar">AD</div><div><b>Admin User</b><small>Super Admin</small></div><button id="profileMenu" aria-label="Profile menu"><i data-lucide="more-horizontal"></i></button></div></div>
  </aside>
  <main class="main">
    <header class="topbar">
      <button class="icon-btn mobile-menu" id="mobileMenu" aria-label="Open menu"><i data-lucide="menu"></i></button>
      <div class="crumb"><span>Workspace</span><i data-lucide="chevron-right"></i><b id="breadcrumb">Dashboard</b></div>
      <div class="top-actions"><div class="search-box"><i data-lucide="search"></i><input id="globalSearch" placeholder="Search anything..."><kbd>⌘ K</kbd></div><button class="icon-btn notification-btn" id="notifications"><i data-lucide="bell"></i><em></em></button><div class="top-avatar">AD</div></div>
    </header>
    <section class="content" id="content"></section>
    <footer>© 2026 OfficeFlow <span>•</span> Built for better workdays</footer>
  </main>
</div>
<div class="modal-backdrop" id="modalBackdrop"><div class="modal" id="modal"></div></div>
<div class="toast-region" id="toastRegion"></div>
<script src="/js/app.js"></script>
</body>
</html>
